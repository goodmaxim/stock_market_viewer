name: Update File

on:
  schedule:
    - cron: "0,30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set environmental variables
        run: echo "bit_api_key=${{ secrets.API_KEY }}" >> .env

      - name: Run script
        run: python runner.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: '*.csv'
          commit_message: "Update file automatically"
